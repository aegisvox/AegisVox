name: Build and publish Docker images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - 'alpha-*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to publish when running manually'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Next.js
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image tags
        id: build-tags
        run: |
          if [[ -n "${INPUT_TAG_NAME}" ]]; then
            tagname="${INPUT_TAG_NAME}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tagname="${GITHUB_REF#refs/tags/}"
          else
            tagname="latest"
          fi

          tags=(
            "ghcr.io/aegisvox/aegisvox:${tagname}"
            "docker.io/aegisvox/aegisvox:${tagname}"
          )

          if [[ "${tagname}" != "latest" ]]; then
            tags+=("ghcr.io/aegisvox/aegisvox:${GITHUB_SHA}")
            tags+=("docker.io/aegisvox/aegisvox:${GITHUB_SHA}")
          fi

          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${tags[@]}" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
          INPUT_TAG_NAME: ${{ github.event.inputs.tag_name }}

      - name: Build and push Docker images
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.build-tags.outputs.tags }}
