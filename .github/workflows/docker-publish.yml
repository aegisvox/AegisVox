name: Build and publish Docker images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - 'alpha-*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image tags
        id: build-tags
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tagname="${GITHUB_REF#refs/tags/}"
            tags="ghcr.io/aegisvox/aegisvox:${tagname}\ndocker.io/aegisvox/aegisvox:${tagname}\nghcr.io/aegisvox/aegisvox:${GITHUB_SHA}\ndocker.io/aegisvox/aegisvox:${GITHUB_SHA}"
          else
            tags="ghcr.io/aegisvox/aegisvox:latest\ndocker.io/aegisvox/aegisvox:latest\nghcr.io/aegisvox/aegisvox:${GITHUB_SHA}\ndocker.io/aegisvox/aegisvox:${GITHUB_SHA}"
          fi
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "$tags" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}

      - name: Build and push Docker images
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.build-tags.outputs.tags }}
